# Final_Project.txt master configuration. Every major decision lives here;
# nothing structural should be hard-coded in the scripts. Mirrored as
# base.json (see sts/utils.load_config) so GPU nodes without PyYAML can
# still read it.

experiment_name: cptac_genbio_distill_hest_pna
seeds: [0, 1, 2]

paths:
  cptac_root: /lustre/nvwulf/scratch/schennareddy/CPTAC/data      # real download landed under data/{BRCA,COAD,ccRCC}/{patient_id}/*.dcm
  cptac_metadata: /lustre/nvwulf/scratch/schennareddy/CPTAC/metadata
  hest_root: /lustre/nvwulf/projects/YurovskyGroup-nvwulf/simons_2026
  # Real per-cancer HEST source locations confirmed on-disk 2026-08-29.
  # Two different provenances: breast's WSI/ST are used in place at the
  # YurovskyGroup project space (not copied locally); colon/kidney were
  # downloaded from HuggingFace MahmoodLab/hest into scratch. Each has its
  # own standard HEST-1k metadata CSV (`id` is the join key for both the
  # WSI file `{wsi_dir}/{id}.tif` and the ST file `{st_dir}/{id}.h5ad`) --
  # see sts/hest_prep.py / scripts/08_prepare_hest_metadata.py.
  hest_by_cancer:
    IDC:                                                            # breast, 127 WSI / 125 ST (~62GB + ~7.4GB), 121/125 rows are oncotree=IDC (4 ILC excluded)
      wsi_dir: /lustre/nvwulf/projects/YurovskyGroup-nvwulf/simons_2026/breast/wsis
      st_dir: /lustre/nvwulf/projects/YurovskyGroup-nvwulf/simons_2026/breast/st
      metadata_csv: /lustre/nvwulf/scratch/schennareddy/HEST-1k/metadata/breast_metadata.csv
      study: hest1k_breast
    COAD:                                                           # colon, 58 WSI / 58 ST (~184GB), oncotree=COAD
      wsi_dir: /lustre/nvwulf/scratch/schennareddy/HEST-1k/data/colon/wsis
      st_dir: /lustre/nvwulf/scratch/schennareddy/HEST-1k/data/colon/st
      metadata_csv: /lustre/nvwulf/scratch/schennareddy/HEST-1k/metadata/colon_metadata.csv
      study: hest1k_colon
    CCRCC:                                                          # kidney, 25 WSI / 25 ST (~18GB), 24/25 rows are oncotree=SCCRCC mapped to CCRCC (1 PRCC excluded, distinct RCC subtype)
      wsi_dir: /lustre/nvwulf/scratch/schennareddy/HEST-1k/data/kidney/wsis
      st_dir: /lustre/nvwulf/scratch/schennareddy/HEST-1k/data/kidney/st
      metadata_csv: /lustre/nvwulf/scratch/schennareddy/HEST-1k/metadata/kidney_metadata.csv
      study: hest1k_kidney
  # `lfs quota -u schennareddy /lustre/nvwulf` reports a 20GB per-user quota
  # ALREADY ~9x over (200GB used) across home+scratch -- the ~500-WSI patch
  # cache alone would be 100GB+ (measured: 205MB for one WSI's 1664
  # patches), so work_dir must NOT live under /home or /scratch. The
  # YurovskyGroup-nvwulf project space has a real 10TB group quota with
  # only 150GB used, so both the ephemeral work_dir and the persistent
  # artifacts below live there instead.
  work_dir: /lustre/nvwulf/projects/YurovskyGroup-nvwulf/srihith/${experiment_name}_work
  # Reusable, expensive artifacts (Step 4's cached GenBio-PathFM teacher
  # embeddings, Step 9's locked ConvNeXt V2-Atto encoder) persist here,
  # independent of any one run's work_dir -- see sts.utils.resolve_run_paths.
  persist_dir: /lustre/nvwulf/projects/YurovskyGroup-nvwulf/srihith/${experiment_name}
  configs: configs
  logs: logs
  manifests: manifests
  qc: qc
  teacher_embeddings: teacher_embeddings
  student_checkpoints: student_checkpoints
  student_embeddings: student_embeddings
  graphs: graphs
  predictions: predictions
  results: results
  figures: figures

cancers:
  cptac: [BRCA, COAD, CCRCC]
  hest: [IDC, COAD, CCRCC]

# ---------------------------------------------------------------- Step 1 --
wsi_selection:
  target_n_patients: 500
  thumbnail_max_dim: 2048
  n_qc_tiles: 80                # sampled 50-100 tiles at ~20x for focus/artifact QC
  qc_tile_px: 512
  hard_filters:
    min_tissue_fraction: 0.05
    max_blurry_tissue_fraction: 0.5
    max_artifact_fraction: 0.35
    min_mpp: 0.1
    max_mpp: 1.0
  quality_weights:              # Q = sum(weight * component)
    usable_tissue: 0.35
    focus: 0.25
    artifact_free: 0.20
    stain_quality: 0.10
    representativeness: 0.10

# ---------------------------------------------------------------- Step 2 --
patching:
  target_mpp: 0.5
  patch_px: 224
  min_tissue_fraction: 0.60
  target_patches_per_wsi: [1000, 2000]
  jpeg_quality: 92
  storage_backend: hdf5          # hdf5 | webdataset | lmdb

# ---------------------------------------------------------------- Step 3 --
cptac_split:
  train_frac: 0.80
  val_frac: 0.10
  test_frac: 0.10
  stratify_by_cancer: true

# ---------------------------------------------------------------- Step 4 --
teacher:
  name: genbio-pathfm
  hf_repo: genbio-ai/genbio-pathfm
  embedding_dim: 4608
  dtype: bf16
  batch_size: 64
  normalize_l2: true

# ---------------------------------------------------------------- Step 5 --
student:
  backbone: convnextv2_atto
  pretrained: imagenet
  backbone_dim: 320
  projection_head: [320, 1024, 4608]   # training-only, deleted after distillation (Step 9)
  downstream_projection: [320, 256]    # optional, learned during HEST downstream training

# ---------------------------------------------------------------- Step 6 --
distillation:
  loss: cosine_plus_feature
  lambda_feature: 0.1
  feature_loss: smooth_l1        # smooth_l1 | normalized_mse
  optimizer: adamw
  backbone_lr: 1.0e-4
  projection_lr: 3.0e-4
  weight_decay: 0.05
  warmup_epochs: 3
  max_epochs: 100
  min_epochs: 50
  early_stop_patience: 15
  grad_clip_norm: 1.0
  batch_size: 256
  amp: true
  augmentation:
    hflip: true
    vflip: true
    rot90: true
    color_jitter: 0.1
    brightness_contrast: 0.1

# ---------------------------------------------------------------- Step 7 --
baselines:
  S0_imagenet_no_distill: true
  S1_genbio_distilled: true
  S2_random_init_distilled: true

# --------------------------------------------------------- Steps 10-12 ---
hest:
  patch_um: 112.0                # 224px @ 0.5 um/px, centered on ST spot
  patch_px: 224
  target_mpp: 0.5
  exclude_species: [mouse]
  n_alignment_qc_samples: 30

# --------------------------------------------------------- Step 11 -------
molecular_targets:
  hvg1000: 1000
  hvg50: 50
  pathway_set: PROGENy14
  pathway_top_genes: 100
  normalize_total_target_sum: 10000

# --------------------------------------------------------- Step 14 -------
patch_head:
  bottleneck: [320, 128, 64]      # 320/256 -> 128 -> 64 molecular latent
  gene_head_dim: 1000
  pathway_head_dim: 14
  dropout: 0.1
  # V2 Phase 7: primary loss is gene-only (V1's mandatory 0.2 pathway
  # weight showed no consistent benefit in PoC_5). pathway_loss_weight is
  # now the DEFAULT for the primary run; the post-lock ablation sweep
  # (V2 Phase 19) iterates pathway_loss_sweep instead, on validation
  # patients only, after the architecture is frozen.
  pathway_loss_weight: 0.0
  pathway_loss_sweep: [0.0, 0.05, 0.10, 0.20]
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  batch_size: 256
  max_epochs: 100
  early_stop_patience: 12

# --------------------------------------------------------- Step 15 -------
# V2 Phase 9: two edge-feature widths now, not one 19-D feature everywhere
# (see sts/graph_builder.py's union_edge_features / per_scale_edge_features):
#   union_edge_dim = 1 (normalized distance) + n_rbf + 3 (scale one-hot) = 20
#   per_scale_edge_dim = 1 (normalized distance) + n_rbf = 17
graph:
  local_radius_um: 150.0
  meso_radius_um: 300.0
  macro_radius_um: 600.0
  max_local_neighbors: 8
  max_meso_neighbors: 12
  max_macro_neighbors: 16
  n_rbf: 16
  rbf_gamma: 10.0

# --------------------------------------------------------- Step 16 -------
pna:
  input_dim: 320                  # or 256 if downstream_projection is used
  hidden_dim: 128
  n_layers: 2                     # V2 Phase 10: two layers per branch, do NOT add APPNP
  aggregators: [mean, max, min, std]
  scalers: [identity, amplification, attenuation]
  dropout: 0.3                    # bumped 0.1->0.3, 2026-08-30: real train/val loss curves (job 84733,
                                   # A8_scale_aware_pna/CCRCC) showed classic overfitting -- train_loss
                                   # -18% (0.82->0.68) over 59 epochs while val_loss barely moved (-5%,
                                   # 1.23->1.17) and got noisy late. Root cause is likely too few distinct
                                   # training PATIENTS (16-96 depending on cancer) relative to this model's
                                   # capacity (3 PNA branches + learned gate for A8) on a single fold with
                                   # no cross-fold averaging -- stronger regularization here is a mitigation,
                                   # not a fix for that underlying small-n-patients ceiling.
  molecular_latent_dim: 64
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-3             # bumped 1.0e-4->1.0e-3, same reason as dropout above
  max_epochs: 100
  early_stop_patience: 8           # bumped down from 15 -- the real curve's val_loss plateaued by
                                   # ~epoch 20-30 and never meaningfully improved after, so patience=15
                                   # let it run needlessly long past the point where it stopped generalizing
  residual_zero_init: true        # Section 20 / V2 Phase 11: final correction layer init near zero

# V2 Phase 15 (A9 architecture control): GATv2 backend, matched depth/
# hidden dim to `pna` above so the PNA-vs-GATv2 comparison isolates the
# message-passing operator, not capacity.
gatv2:
  heads: 4                        # hidden_dim (128, from `pna`) must be divisible by heads

# V2 Phase 12 (A8, the proposed final model): Scale-Aware Residual
# Multiscale PNA -- three independent per-scale PNA branches (reusing
# `pna`'s hidden_dim/n_layers/aggregators/scalers/dropout for each branch)
# fused by a learned softmax gate.
scale_aware_pna:
  gate_hidden_dim: 128

# --------------------------------------------------------- Step 18 -------
# V2 Phase 20: run only after A8 is trained and behaves correctly.
# "ideally preserve local/meso/macro edge counts" per scale, not just the
# aggregate degree distribution, when implementing the per-q replacement.
destruction_dose_response:
  q_values: [0.0, 0.25, 0.5, 0.75, 1.0]

# --------------------------------------------------------- Step 19 -------
# V2 Phase 1: report per-cancer (IDC/COAD/CCRCC) as three SEPARATE primary
# experiments; pooled-across-cancers is secondary (see
# sts.cv_folds.build_cv_grid's "primary_analysis_unit" field).
cross_validation:
  n_outer_folds: 5
  n_seeds: 3
  seeds: [0, 1, 2]
  min_folds_if_too_few_patients: 3
  primary_analysis_unit: per_cancer

# --------------------------------------------------------- Step 21 -------
statistics:
  n_bootstrap: 10000
  ci: [2.5, 97.5]
  fdr_q: 0.05

evaluation:
  min_regions_per_patient: 10
  gene_r_thresholds: [0.0, 0.2, 0.3]

# --------------------------------------------------------- Step 24 -------
# V2 Phase 21: fair GenBio-vs-student comparison via training-fold-only
# PCA (replaces V1's ambiguous raw-4608-D-into-a-mismatched-head
# approach). Run only after the A0-A9 student model matrix is locked.
genbio_fair_comparison:
  pca_n_components: 256
  ridge_alpha: 1.0

# --------------------------------------------------------- V2 Phase 22 ---
# Three primary statistical gates (replaces V1's single primary-hypothesis
# test). Gate 3 is the same "real vs shuffled" test as V1's Section 25,
# now explicitly run against A8 (scale-aware) rather than A7 (union
# multiscale), since A8 is the proposed final model.
# gate1_distillation REMOVED 2026-08-30 along with A1_imagenet_patch (see sts/ablations.py) --
# it compared A2 against A1, which was silently identical to A2 due to a feature-loading bug.
primary_gates:
  gate2_spatial_context: {better: A8_scale_aware_pna, worse: A2_distilled_patch}
  gate3_true_topology: {better: A8_scale_aware_pna, worse: A5_shuffled_graph}
