[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epathst"
version = "0.1.0"
description = "Efficient histopathology model with multiscale graph learning for spatial transcriptomic prediction."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=0.9.12",
    "torch_geometric>=2.4",
    "openslide-bin>=4.0",
    "wsidicom>=0.20",
    "pydicom>=2.4",
    "boto3>=1.34",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "scanpy>=1.9",
    "anndata>=0.10",
    "matplotlib>=3.7",
    "tqdm>=4.66",
    "pyarrow>=14",
    "h5py>=3.10",
    "safetensors>=0.4",
    "pyyaml>=6.0",
    "transformers>=4.38",
    "decoupler>=1.5",
    "umap-learn>=0.5",
]

[project.optional-dependencies]
efficiency = ["fvcore>=0.1.5"]  # FLOPs/MACs accounting; epathst.efficiency degrades gracefully without it

[tool.setuptools.packages.find]
where = ["src"]
include = ["epathst*"]

[tool.black]
line-length = 100
target-version = ["py39"]
